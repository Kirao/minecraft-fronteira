<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minecraft Fronteira | Criadores</title>
  <meta name="description" content="Todos os criadores da série Minecraft Fronteira, quem está ao vivo agora e as redes de cada um." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#1a0f3d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css?v=24" />
</head>
<body>
  <div class="fundo" aria-hidden="true"></div>

  <header class="topo">
    <div class="banner">
      <h1 class="logo"><img src="logo.webp" alt="Minecraft Fronteira" width="700" height="178" /></h1>
    </div>
  </header>

  <main>
    <h2 class="titulo"><img src="ui/btn.webp" alt="Criadores" width="490" height="125" /></h2>
    <p class="contagem" id="contagem"></p>
    <p class="ir-multi"><a href="multistream.html"><i class="fa-solid fa-tv"></i> Assistir as lives aqui (multistream)</a></p>

    <div class="busca">
      <img class="divisor esq" src="ui/divisor2.webp" alt="" aria-hidden="true" />
      <label class="campo">
        <span class="bolinha" aria-hidden="true"></span>
        <input id="busca" type="search" placeholder="Buscar criador..." autocomplete="off" aria-label="Buscar criador" />
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      </label>
      <button id="so-live" class="filtro-live" type="button" aria-pressed="false" title="Mostrar só quem está ao vivo">
        <span class="ponto-live"></span> Online agora
      </button>
      <button id="atualizar" class="filtro-live atualizar" type="button" title="Verificar de novo quem está ao vivo agora" aria-label="Atualizar quem está ao vivo">
        <i class="fa-solid fa-rotate"></i>
      </button>
      <img class="divisor dir" src="ui/divisor2.webp" alt="" aria-hidden="true" />
    </div>

    <section id="grade" class="grade" aria-live="polite"></section>
  </main>

  <footer class="rodape">
    <img class="status" src="ui/status.webp" alt="Status ao vivo da Twitch atualiza sozinho a cada minuto." width="1065" height="110" />
    <div class="creditos">
      <div class="pilula kirao" title="Discord: .kirao">
        <img class="fundo-pilula" src="ui/pill_kirao.webp" alt="By .kirao no Discord" width="398" height="102" />
        <img class="foto-kirao" src="fotos/kirao.jpg" alt="" aria-hidden="true" />
      </div>
      <div class="mapa">
        <a class="pilula" href="https://miro.com/app/board/uXjVEUMrSqo=/" target="_blank" rel="noopener" title="Mapa do Forever no Miro">
          <img class="fundo-pilula" src="ui/pill_mapa.webp" alt="Créditos: Mapa do Forever" width="632" height="102" />
        </a>
        <div class="balao" role="tooltip">
          <span>Os personagens e avatares foram tirados do mapa do Forever!</span>
        </div>
      </div>
    </div>
  </footer>

  <script src="participantes.js?v=24"></script>
  <script src="app.js?v=24"></script>
</body>
</html>
