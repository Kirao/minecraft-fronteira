<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minecraft Fronteira | Multistream</title>
  <meta name="description" content="Assista várias lives da série Minecraft Fronteira ao mesmo tempo." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#1a0f3d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css?v=25" />
  <link rel="stylesheet" href="multistream.css?v=25" />
</head>
<body class="pagina-multi">
  <div class="fundo" aria-hidden="true"></div>

  <header class="multi-topo">
    <a class="voltar img-btn" href="./" aria-label="Voltar para Criadores"><img src="ui/ms_voltar.webp" alt="← Criadores" width="226" height="70" /></a>
    <a href="./" class="multi-logo"><img src="logo.webp" alt="Minecraft Fronteira" width="700" height="178" /></a>
    <div class="multi-acoes">
      <button id="btn-chat" class="acao img-btn" title="Mostrar/esconder chat" aria-label="Chat"><img src="ui/ms_chatbtn.webp" alt="Chat" width="210" height="64" /></button>
      <button id="btn-link" class="acao img-btn" title="Copiar link desta seleção" aria-label="Copiar link"><img src="ui/ms_link.webp" alt="Copiar Link" width="252" height="64" /><span class="aviso" id="aviso-link"></span></button>
    </div>
  </header>

  <section class="seletor">
    <div class="seletor-titulo">
      <h1>Multistream</h1>
    </div>
    <p class="dica" id="dica">Carregando quem está ao vivo...</p>
    <div class="lista-live" id="lista-live"></div>
    <img class="divisor-ms" src="ui/ms_divisor.webp" alt="" aria-hidden="true" />
  </section>

  <main class="palco" id="palco">
    <div class="telas" id="telas"></div>
    <aside class="chat" id="chat" hidden>
      <div class="chat-abas" id="chat-abas"></div>
      <div class="chat-login">
        <span>Pra conversar, entre na Twitch.</span>
        <span>
          <a href="https://www.twitch.tv/login" target="_blank" rel="noopener"><i class="fa-brands fa-twitch"></i> Entrar</a>
          <a class="sec" id="chat-popout" href="#" target="_blank" rel="noopener" title="Abrir o chat numa janela da Twitch"><i class="fa-solid fa-up-right-from-square"></i></a>
        </span>
      </div>
      <iframe id="chat-frame" title="Chat da Twitch"></iframe>
    </aside>
  </main>

  <script src="participantes.js?v=25"></script>
  <script src="multistream.js?v=25"></script>
</body>
</html>
